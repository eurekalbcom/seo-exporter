name: deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA on main
        required: true
        type: string
      image_digest:
        description: Digest of ghcr.io/eurekalbcom/seo-exporter:sha-<sha>. Empty builds the SHA.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: seo-readonly-deploy
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ inputs.image_digest == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Publish guard
        env:
          DEPLOY_ENABLED: ${{ vars.SEO_DEPLOY_ENABLED }}
        run: |
          if [ "$DEPLOY_ENABLED" != "true" ]; then echo "HOLD: SEO_DEPLOY_ENABLED != true"; exit 1; fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main

      - name: sha-guard
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
        run: bash deploy/sha_guard.sh

      - name: Checkout selected commit
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
        run: git checkout --detach "$DEPLOY_SHA"

      - name: Build and push image
        id: push
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_REPO: ghcr.io/eurekalbcom/seo-exporter
          DEPLOY_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          bash deploy/build_push.sh
          digest_file="${RUNNER_TEMP}/seo-image-digest"
          digest=$(tr -d '[:space:]' < "$digest_file")
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "registry digest missing" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    if: ${{ !cancelled() && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: seo-readonly
    permissions:
      contents: read
      packages: read
    steps:
      - name: HOLD guard (fail-closed)
        env:
          DEPLOY_ENABLED: ${{ vars.SEO_DEPLOY_ENABLED }}
          TS_OAUTH: ${{ secrets.EUK_OAUTH_TAILSCALE_SEO_DEPLOY }}
        run: |
          if [ "$DEPLOY_ENABLED" != "true" ]; then echo "HOLD: SEO_DEPLOY_ENABLED != true"; exit 1; fi
          [ -n "$TS_OAUTH" ] || { echo "missing Tailscale OAuth secret"; exit 1; }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main

      - name: sha-guard
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
        run: bash deploy/sha_guard.sh

      - name: Verify rollback digest
        if: ${{ inputs.image_digest != '' }}
        env:
          GHCR_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          DEPLOY_SHA: ${{ inputs.sha }}
        run: bash deploy/verify_rollback.sh

      - name: Checkout selected commit
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
        run: git checkout --detach "$DEPLOY_SHA"

      # Target host is witold216 (develop). The address comes from
      # EUK_VAR_SEO_TARGET_HOST and is not committed.
      - name: Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd
        with:
          oauth-client-id: ${{ fromJSON(secrets.EUK_OAUTH_TAILSCALE_SEO_DEPLOY).client_id }}
          oauth-secret: ${{ fromJSON(secrets.EUK_OAUTH_TAILSCALE_SEO_DEPLOY).client_secret }}
          tags: tag:gh-seo-deploy
          version: "1.94.2"

      - name: Deploy over SSH
        env:
          SEO_TARGET_HOST: ${{ vars.EUK_VAR_SEO_TARGET_HOST }}
          SEO_TARGET_HOSTKEY: ${{ vars.EUK_VAR_SEO_TARGET_HOSTKEY }}
          SSH_KEY: ${{ secrets.EUK_SSH_SEO_DEPLOY_W216 }}
          GSC_JSON: ${{ secrets.EUK_OAUTH_GSC_READONLY }}
          BING_JSON: ${{ secrets.EUK_OAUTH_BING_READONLY }}
          GSC_SITE: ${{ vars.EUK_VAR_SEO_GSC_SITE }}
          BING_SITE: ${{ vars.EUK_VAR_SEO_BING_SITE }}
          SEO_REMOTE_WRITE_PORT: ${{ vars.SEO_REMOTE_WRITE_PORT }}
          IMAGE_REPO: ghcr.io/eurekalbcom/seo-exporter
          IMAGE_DIGEST: ${{ inputs.image_digest || needs.publish.outputs.digest }}
        run: bash deploy/ssh_deploy.sh
