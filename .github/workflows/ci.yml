name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  crawlseo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: crawlseo
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: crawlseo/package-lock.json

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run

      - name: Audit
        # braces <=3.0.3 (GHSA-vfj7-8cjw-p6xm) is dev-only via eslint-config-next
        # and has no patched release. Production dependencies are audited here.
        run: npm audit --omit=dev --audit-level=high

      - name: Docker build
        run: docker build -t seo-autopilot:ci .

  orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: orchestrator/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npx vitest run

      - name: Audit
        run: npm audit --audit-level=high

  seo-exporter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Pytest
        run: python -m pytest

      - name: Install shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Shellcheck
        run: |
          set -euo pipefail
          shellcheck deploy/sha_guard.sh deploy/ssh_deploy.sh deploy/build_push.sh \
            deploy/seo-exporter-compose deploy/check_workflows.sh deploy/compose_config.sh \
            deploy/verify_rollback.sh deploy/compose_up_smoke.sh

      - name: Workflow policy
        run: bash deploy/check_workflows.sh

      - name: actionlint
        run: |
          set -euo pipefail
          version=1.7.12
          expected=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          workdir=$(mktemp -d)
          trap 'rm -rf -- "$workdir"' EXIT
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "${workdir}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          echo "${expected}  ${archive}" | (cd "$workdir" && sha256sum -c -)
          tar -C "$workdir" -xzf "${workdir}/${archive}" actionlint
          "$workdir/actionlint" -color

      - name: hadolint
        run: |
          set -euo pipefail
          version=2.12.0
          expected=56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010
          workdir=$(mktemp -d)
          trap 'rm -rf -- "$workdir"' EXIT
          curl -fsSL --retry 3 -o "${workdir}/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${version}/hadolint-Linux-x86_64"
          echo "${expected}  hadolint" | (cd "$workdir" && sha256sum -c -)
          chmod 0755 "${workdir}/hadolint"
          "${workdir}/hadolint" Dockerfile

      - name: Compose config
        run: bash deploy/compose_config.sh

      - name: Compose up
        run: bash deploy/compose_up_smoke.sh
