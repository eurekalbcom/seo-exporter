name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  crawlseo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: crawlseo
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: crawlseo/package-lock.json

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run

      - name: Audit
        # braces <=3.0.3 (GHSA-vfj7-8cjw-p6xm) is dev-only via eslint-config-next
        # and has no patched release. Production dependencies are audited here.
        run: npm audit --omit=dev --audit-level=high

      - name: Docker build
        run: docker build -t seo-autopilot:ci .

  orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: orchestrator/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npx vitest run

      - name: Audit
        run: npm audit --audit-level=high
