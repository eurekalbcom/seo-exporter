# Dedicated compose project for the read-only SEO exporter and its
# Prometheus agent.
# Provider APIs and remote_write need egress, so the network is not internal.
name: seo-exporter

services:
  seo-exporter:
    image: ${SEO_EXPORTER_IMAGE:?SEO_EXPORTER_IMAGE must be name@sha256:digest}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    networks:
      - seo-exporter_net
    env_file:
      - path: data/.env
        required: true
    environment:
      CREDENTIALS_DIRECTORY: /run/credentials/seo-exporter
      SEO_EXPORTER_BIND: 0.0.0.0
      SEO_EXPORTER_PORT: "9108"
      SEO_EXPORTER_STATE_DIR: /var/lib/seo-exporter/state
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    # Parent mount, not the state directory. A new volume root is owned by
    # root; the image seeds state/ as uid 10001 mode 0700 and Docker copies
    # that child in, so rotated refresh tokens survive restart.
    volumes:
      - seo-exporter-state:/var/lib/seo-exporter
    tmpfs:
      - /run/credentials:uid=10001,gid=10001,mode=0750
      - /tmp:uid=10001,gid=10001,mode=1770
    restart: unless-stopped

  prometheus-agent:
    # prom/prometheus:v3.15.1 linux/amd64 (same digest as the busybox tag)
    image: prom/prometheus:v3.15.1@sha256:d445d1806b38f85b5c394a1b87f94113fde0473b45245922c2e8b1bd41fa68ae
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    networks:
      - seo-exporter_net
    environment:
      SEO_REMOTE_WRITE_PORT: ${SEO_REMOTE_WRITE_PORT:?SEO_REMOTE_WRITE_PORT is required}
    entrypoint: ["/bin/sh", "/etc/prometheus/entrypoint.sh"]
    volumes:
      - type: bind
        source: ./deploy/prometheus-agent.yml
        target: /etc/prometheus/prometheus.yml.template
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deploy/prometheus-agent-entrypoint.sh
        target: /etc/prometheus/entrypoint.sh
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /prometheus:uid=65534,gid=65534,mode=0750
      - /tmp:uid=65534,gid=65534,mode=1770
    restart: unless-stopped

networks:
  seo-exporter_net:
    name: seo-exporter_net
    driver: bridge

volumes:
  seo-exporter-state:
